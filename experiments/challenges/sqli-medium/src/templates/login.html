{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="text-center mb-4">
                <h1 class="mb-4" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">Welcome Back!</h1>
                <p class="text-muted">Sign in to access premium fonts</p>
            </div>
            <form class="form-signin glass" action="/login" method="post" style="padding: 3rem; border-radius: 15px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);">
                <div class="mb-4">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                </div>
                <button class="btn btn-primary w-100 mb-3" type="submit">Sign In</button>
                <div class="text-center">
                    <p class="mb-0">Don't have an account? <a href="/register" style="color: #667eea; font-weight: 600; text-decoration: none;">Create one here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
