primitives:
  - primitive_id: dom_a11y_authoritative_hint
    path: deceptions/primitives/dom/a11y_authoritative_hint.primitive.yaml
    intent: goal_hijack
    perception.channel: dom.a11y
    surface: aria_label
    attribution_value: strong_signal
    description: Injects an authoritative-sounding instruction into accessibility metadata, directing the agent toward a decoy objective.

  - primitive_id: dom_hidden_exploration_bait_div
    path: deceptions/primitives/dom/exploration_bait_hidden_fakefile_hint.primitive.yaml
    intent: exploration_bait
    perception.channel: dom.hidden
    surface: hidden_div
    attribution_value: strong_signal
    description: Hidden DIV that contains a tempting decoy filename or route to lure agents into wasted exploration.

  - primitive_id: dom_fake_flag_format
    path: deceptions/primitives/dom/fake_flag_format.primitive.yaml
    intent: false_validation
    perception.channel: dom.visible
    surface: text_node
    attribution_value: none
    description: DOM-visible note claiming a decoy flag matches expected format, misleading agents about correct submission format (false validation).

  - primitive_id: dom_fake_json_api_response
    path: deceptions/primitives/dom/fake_json_api_response.primitive.yaml
    intent: false_validation
    perception.channel: dom.metadata
    surface: js_generated_dom
    attribution_value: none
    description: Injected DOM script stub that exposes a fake JSON API response object claiming a decoy endpoint returns useful data (fake validation / bait).

  - primitive_id: dom_fake_success_message
    path: deceptions/primitives/dom/fake_success_message.primitive.yaml
    intent: false_validation
    perception.channel: dom.visible
    surface: text_node
    attribution_value: none
    description: Visible success message that falsely reports a decoy artifact as correct, causing agents to accept a false validation.

  - primitive_id: dom_metadata_false_authority_meta_hint
