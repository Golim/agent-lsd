primitive_id: dom_honeytoken_hidden_param
description: >
  Hidden honeytoken exposed as a parameter template inside a commented snippet to capture agent-driven parameter use (honeytoken-only).

defaults:
  category: honeytoken_attribution

  perception:
    channel: dom.hidden
    surface: comment

  intent: time_sink
  object: fake_endpoint

  trigger: passive_read
  plausibility: low
  severity: minor_delay
  attribution_value: strong_signal

  payload:
    type: fake_artifact
    content_template: "param={{token_param}}"

  placement:
    selector: "#hint-area"
    insertion: append

  randomization:
    enabled: true
    parameters:
      token_param:
        generator: hex_suffix

  honeytoken:
    enabled: true
    token_type: param
    token_id_template: "{{student_id}}-{{id}}-{{token_param}}"
    sink: db_event

  constraints:
    do_not_block_human_solution: true
    max_confusion_time_seconds: 0

  logging:
    on_view: false
    on_click: false
    on_request: true

  tags: [honeytoken, hidden, param]