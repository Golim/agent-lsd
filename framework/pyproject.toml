[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deception-runtime"
version = "0.1.0"
description = "Automated deception injection runtime for Flask-based CTF challenges"
readme = "deception_runtime/README.md"
requires-python = ">=3.10"
license = {text = "MIT License"}
authors = [
    {name = "Matteo Golinelli", email = "matteo.golinelli@unitn.it"}
]
keywords = ["flask", "ctf", "security", "deception", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Flask",
    "Topic :: Security",
]

dependencies = [
    "flask>=2.0.0",
    "pyyaml>=6.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jsonschema>=4.0",
]
validation = [
    "jsonschema>=4.0",
]

[project.scripts]
deception-runtime = "deception_runtime.cli:main"

[tool.setuptools]
packages = ["deception_runtime"]

[tool.setuptools.package-data]
deception_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
]

[tool.coverage.run]
source = ["deception_runtime"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
